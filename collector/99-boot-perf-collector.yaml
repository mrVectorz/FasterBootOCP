---
# Generated by make-machineconfig.py -- do not edit inline; edit the source
# files in deliverables/collector/ and regenerate.
#
# Installs an early-boot performance collector that starts before crio and
# kubelet and runs off the reserved CPU set.
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-master-boot-perf-collector
  labels:
    machineconfiguration.openshift.io/role: master
spec:
  config:
    ignition:
      version: 3.4.0
    storage:
      files:
        - path: /usr/local/bin/boot-perf-collect.sh
          mode: 0755
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: boot-perf.slice
          enabled: false
          contents: |
            [Unit]
            Description=Slice for the early-boot performance collector
            Before=slices.target
            DefaultDependencies=no

            [Slice]
            # Accounting on, no limits: we want this slice's own cost visible in the data
            # so its overhead can be subtracted from the platform totals.
            CPUAccounting=yes
            MemoryAccounting=yes
            IOAccounting=yes
        - name: boot-perf-collect.service
          enabled: true
          contents: |
            [Unit]
            Description=Early-boot performance collector (SNO reserved-CPU contention)
            Documentation=https://access.redhat.com/solutions/
            # Start before the two services whose contention we are measuring, so the
            # first sample predates any container work. local-fs is needed for /var/log.
            DefaultDependencies=no
            After=local-fs.target systemd-journald.service
            Before=crio.service kubelet.service shutdown.target
            Conflicts=shutdown.target

            [Service]
            Type=simple
            # The collector must not live in the reserved pool. Workload partitioning
            # applies a global systemd CPUAffinity; this overrides it for this unit only.
            # The script narrows further with taskset once it can read the isolated set.
            CPUAffinity=
            Nice=10
            IOSchedulingClass=idle
            Environment=BOOT_PERF_INTERVAL=1
            Environment=BOOT_PERF_SLOW_EVERY=15
            Environment=BOOT_PERF_DURATION=2700
            ExecStart=/usr/local/bin/boot-perf-collect.sh
            # Hard ceiling so a wedged collector never outlives the boot window.
            RuntimeMaxSec=3000
            TimeoutStopSec=120
            Restart=no
            # Keep the collector itself out of the cgroup it is measuring.
            Slice=boot-perf.slice

            [Install]
            WantedBy=multi-user.target
